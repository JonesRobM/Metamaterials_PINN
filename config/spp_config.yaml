# ============================================================================
# SPP Problem Configuration — standalone experiment config
# ============================================================================
#
# This file is consumed directly by scripts/train_spp_pinn.py, which reads it
# with a plain yaml.safe_load.  It deliberately uses a FLAT schema (top-level
# x_range, frequency, metal_permittivity, ...) and is NOT part of the nested
# project schema handled by ConfigManager.load_full_config()
# (base_config.yaml + metamaterial_params.yaml).
#
# To read it through the config package use ConfigManager().load_raw
# ("spp_config"), which performs no validation or numeric-string processing.
# Keep the key names below stable: the training script indexes them directly.
# ============================================================================

# --- Simulation Domain ---
x_range: [-1.0e-6, 1.0e-6]
y_range: [-1.0e-6, 1.0e-6]
z_range: [-1.0e-6, 1.0e-6]
interface_z: 0.0

# --- Material Properties ---
# For a Silver/Air interface at 633nm
metal_permittivity: [-19, 0.53] # Complex permittivity of Silver (real, imag)
dielectric_permittivity: 1.0 # Permittivity of Air

# --- Wave Properties ---
# ANGULAR frequency (rad/s). SPPNetwork and the loss functions take omega, not
# a linear frequency: omega = 2*pi*c / lambda0 with lambda0 = 633 nm.
# (An earlier value here, 4.74e14, was the linear frequency in Hz — a factor-2pi
# error in k0.)
frequency: 2.9758e15

# --- PINN Model ---
model:
  name: "SPPNetwork"
  spatial_dim: 3
  field_components: 6
  hidden_dims: [128, 128, 128, 128]
  complex_valued: True
  use_fourier: True
  fourier_modes: 128
  activation_type: 'complex_tanh'

# --- Training Parameters ---
training:
  num_epochs: 10000
  learning_rate: 1.0e-4
  num_collocation_points: 20000
  num_interface_points: 2000
  
  # Loss weights (will be adapted by EM_CompositeLoss)
  loss_weights:
    maxwell_curl: 1.0
    tangential_continuity: 10.0
    spp_boundary: 1.0
